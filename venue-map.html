<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 - Venue Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background-color: #f8fafc; }
    #map { height: 100%; width: 100%; z-index: 10; }
    
    /* Custom Map Marker Styling */
    .custom-marker {
      background-color: #0a2540;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .custom-marker.active {
      background-color: #3b82f6; /* Bright blue when selected */
      transform: scale(1.3);
      border-color: #eff6ff;
    }
  </style>
</head>
<body class="h-screen w-full flex flex-col md:flex-row overflow-hidden text-slate-900">

  <div class="h-[50vh] md:h-full w-full md:w-2/3 relative bg-slate-200">
    <div class="absolute top-6 left-16 z-[20] pointer-events-none hidden md:block">
      <h1 class="text-3xl font-black tracking-tight text-[#0a2540] drop-shadow-md">VENUES & HOST CITIES</h1>
      <p class="text-slate-600 font-semibold tracking-wide text-sm mt-1 bg-white/80 backdrop-blur-sm inline-block px-3 py-1 rounded border border-slate-200 shadow-sm">Select a city to view match schedules</p>
    </div>
    
    <div id="map"></div>
  </div>

  <div id="sidebar" class="h-[50vh] md:h-full w-full md:w-1/3 bg-white shadow-[-10px_0_30px_rgba(0,0,0,0.05)] border-l border-slate-200 z-[30] overflow-y-auto flex flex-col transition-all duration-300">
    
    <div id="empty-state" class="flex flex-col items-center justify-center h-full p-8 text-center text-slate-400">
      <svg class="w-16 h-16 mb-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
      <p class="font-semibold text-lg text-slate-600">Explore the Map</p>
      <p class="text-sm mt-2">Click on any host city to view stadium details and upcoming matches.</p>
    </div>

    <div id="data-state" class="hidden flex flex-col h-full">
      <div class="bg-[#0a2540] text-white p-8 pb-6">
        <div class="text-blue-300 text-xs font-bold tracking-[0.2em] uppercase mb-2" id="venue-city">City, ST</div>
        <h2 class="text-3xl font-black tracking-tight leading-none mb-4" id="venue-name">Stadium Name</h2>
        
        <div class="flex gap-4 text-sm font-medium text-slate-300">
          <span class="flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> <span id="venue-capacity">0</span></span>
          <span class="flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg> <span id="venue-roof">Open</span></span>
        </div>
      </div>

      <div class="flex-1 p-6 bg-slate-50">
        <h3 class="text-sm font-bold tracking-widest text-slate-400 uppercase mb-4">Matches at this venue</h3>
        <div id="match-list" class="space-y-3">
          </div>
        
        <button class="w-full mt-6 bg-white border border-slate-200 text-[#0a2540] font-bold py-3 rounded-lg shadow-sm hover:bg-slate-50 hover:border-slate-300 transition-colors">
          View Full Venue Guide &rarr;
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. Initialize Map
    // Centered on North America, zoomed out to see all 3 countries
    const map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
    
    // Move zoom control to bottom right so it doesn't overlap our title
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Use a clean, light "broadcast" style tile layer (CartoDB Positron)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // 2. Define Mock Venue Data
    // We are mixing your CLAUDE.md info with mock match data
    const venues = [
      {
        id: "ny", coords: [40.8128, -74.0745],
        name: "MetLife Stadium", city: "East Rutherford, NJ", capacity: "82,500", roof: "Open Air",
        matches: [
          { date: "Jun 13", teams: "ARG vs MEX", round: "Group Stage" },
          { date: "Jun 18", teams: "USA vs COL", round: "Group Stage" },
          { date: "Jul 19", teams: "TBD vs TBD", round: "Final" }
        ]
      },
      {
        id: "la", coords: [33.9534, -118.3387],
        name: "SoFi Stadium", city: "Inglewood, CA", capacity: "70,240", roof: "Fixed Roof",
        matches: [
          { date: "Jun 12", teams: "BRA vs JPN", round: "Group Stage" },
          { date: "Jun 28", teams: "TBD vs TBD", round: "Round of 32" }
        ]
      },
      {
        id: "mx", coords: [19.2836, -99.1360],
        name: "Estadio Banorte", city: "Mexico City, MEX", capacity: "36,000", roof: "Open Air",
        matches: [
          { date: "Jun 11", teams: "MEX vs RSA", round: "Group Stage" },
          { date: "Jun 16", teams: "ENG vs SEN", round: "Group Stage" }
        ]
      },
      {
        id: "to", coords: [43.6332, -79.4186],
        name: "BMO Field", city: "Toronto, CAN", capacity: "45,000", roof: "Open Air",
        matches: [
          { date: "Jun 14", teams: "CAN vs SWE", round: "Group Stage" },
          { date: "Jul 04", teams: "TBD vs TBD", round: "Round of 16" }
        ]
      }
    ];

    let currentActiveMarker = null;

    // 3. Render Markers and Handle Clicks
    venues.forEach(venue => {
      // Create custom HTML marker
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div id="marker-${venue.id}" class="custom-marker w-5 h-5 md:w-6 md:h-6"></div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      const marker = L.marker(venue.coords, { icon }).addTo(map);

      marker.on('click', () => {
        // Reset previous active marker
        if (currentActiveMarker) {
          document.getElementById(`marker-${currentActiveMarker}`).classList.remove('active');
        }
        
        // Set new active marker
        document.getElementById(`marker-${venue.id}`).classList.add('active');
        currentActiveMarker = venue.id;

        // Slight pan to center the marker (optional, but feels nice)
        map.panTo(venue.coords);

        // Update Sidebar UI
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('data-state').classList.remove('hidden');
        
        document.getElementById('venue-name').innerText = venue.name;
        document.getElementById('venue-city').innerText = venue.city;
        document.getElementById('venue-capacity').innerText = venue.capacity;
        document.getElementById('venue-roof').innerText = venue.roof;

        // Inject match cards
        const matchContainer = document.getElementById('match-list');
        matchContainer.innerHTML = venue.matches.map(m => `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center hover:border-blue-300 transition-colors cursor-pointer">
            <div>
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${m.round}</div>
              <div class="font-black text-slate-800 tracking-tight mt-0.5">${m.teams}</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-[#3b82f6]">${m.date}</div>
            </div>
          </div>
        `).join('');
      });
    });
  </script>
</body>
</html>
